name: Android Release

# Releases are cut deliberately, from a tag or by hand.
#
# This used to run on every push to master, which published a GitHub release per
# commit while versionCode stayed pinned at 1 -- so every "release" looked like
# the same version to Android and could not be installed over its predecessor.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name for a manual release (e.g. 1.2.0)"
        required: true
        default: "0.0.0-manual"

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating a release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version_name }}"
          fi
          echo "version_name=${VERSION}" >> "$GITHUB_OUTPUT"
          # run_number is monotonic per workflow, which is what Android needs to
          # recognise a build as newer than the one already installed.
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Run tests before releasing
        run: ./gradlew testDebugUnitTest --stacktrace

      # The keystore is never committed. It is injected here from a secret, and the
      # guard means a fork without the secret produces an unsigned APK instead of
      # failing on a zero-byte keystore.
      - name: Decode release keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "path=${RUNNER_TEMP}/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >
          ./gradlew assembleRelease --stacktrace
          -PversionName=${{ steps.version.outputs.version_name }}
          -PversionCode=${{ steps.version.outputs.version_code }}
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Warn when the APK is unsigned
        if: steps.keystore.outputs.path == ''
        run: |
          echo "::warning::RELEASE_KEYSTORE_BASE64 is not set - the published APK is UNSIGNED and cannot be installed."

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version_name) }}
          name: Release ${{ steps.version.outputs.version_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
