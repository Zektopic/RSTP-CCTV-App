name: CI

# Runs on every pull request and every push to master.
# Previously nothing was verified before a release was cut -- no tests, no lint,
# and pull requests were never built at all.
permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: [self-hosted, manupa-hnx]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Git safe directory
        run: git config --global --add safe.directory '*'

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      # Debug only: release signing credentials are not available to pull requests
      # from forks, and a build should never depend on secrets to prove it compiles.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Compiles src/androidTest. Without this the instrumented tests can drift out of
      # sync with the code they test and nothing notices until someone runs them on a device.
      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
